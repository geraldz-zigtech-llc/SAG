{% extends "base.html" %}
{% block main %}
<section class="section watermark" aria-labelledby="page-title">
  <div class="section-inner">
    <h1 id="page-title" class="pill-title pill-light">{{ heading }}</h1>
    <p class="lead">{{ intro }}</p>
    <ul class="people-grid">
      {% for m in people %}
      <li>
        <a class="person-card" href="{{ m.slug }}.html">
          {% if m.photo %}<img src="{{ root }}{{ m.photo }}" alt="" width="300" height="450" loading="lazy">
          {% else %}<span class="person-placeholder" aria-hidden="true"><img src="{{ root }}assets/img/brand/sag-crest.png" alt="" width="120" height="137"></span>{% endif %}
          <span class="person-label"><span class="person-role">{{ m.role }}</span><span class="person-name">{{ m.name }}</span></span>
        </a>
      </li>
      {% endfor %}
    </ul>
    <p class="cta-row"><a class="btn btn-solid" href="{{ root }}about.html">Back to About</a></p>
  </div>
</section>
{% endblock %}
